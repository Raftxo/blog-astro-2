name: Deploy to GitHub Pages

on:
  # Publica cada push a `master` (rama actual del repositorio).
  push:
    branches: [master]
  # Permite lanzarlo manualmente desde la pestaña Actions.
  workflow_dispatch:

# Permisos necesarios para crear el despliegue de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7
      - name: Instalar, compilar y subir el sitio
        uses: withastro/action@v6
        with:
          # Coincide con el motor declarado en package.json.
          node-version: 22.23.4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
